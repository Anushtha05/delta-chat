[project]
name = "delta-chat-backend"
version = "0.1.0"
description = "Delta Chat — Python FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pymysql>=1.1.0",
    "cryptography>=41.0.0",
    "sqlalchemy>=2.0.23",
    "pymongo>=4.6.0",
    "pdfplumber>=0.10.0",
    "pymupdf>=1.23.0",
    "pytesseract>=0.3.10",
    "pillow>=10.1.0",
    "rapidfuzz>=3.5.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "ezdxf>=0.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
